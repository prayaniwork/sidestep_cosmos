<title>Sidestep Cosmos</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
p{margin:0}
h1,h2,h3{font-family:var(--display);font-weight:var(--display-w);letter-spacing:var(--display-ls);margin:0;line-height:1.06;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3.1rem)}
h2{font-size:clamp(1.45rem,4vw,2rem)}
h3{font-size:1.25rem}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0}
.help{color:var(--ink-2);max-width:62ch}
.grow{flex:1 1 auto}

/* ---------- stage layers ---------- */
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#veil{position:fixed;inset:0;pointer-events:none;background:var(--veil);opacity:0;transition:opacity .8s ease}
body:not([data-screen="world"]) #veil{opacity:1}
body.cine #veil{opacity:0}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;transition:opacity .6s}
#ui{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 108px);transition:opacity .5s}
body[data-screen="world"] #ui{pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:16px;overflow:hidden}
body[data-screen="world"] #ui > *{pointer-events:auto}
body[data-screen="world"] #ui > .w-bottom{pointer-events:none}
body[data-screen="world"] #ui > .w-bottom > *{pointer-events:auto}
body.cine #ui{opacity:0;pointer-events:none}
body.focus #ui{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.page{max-width:780px;margin:0 auto;display:grid;gap:18px}
@media (prefers-reduced-motion:no-preference){
  .page > *{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  .page > *:nth-child(2){animation-delay:.1s}.page > *:nth-child(3){animation-delay:.2s}.page > *:nth-child(4){animation-delay:.3s}.page > *:nth-child(5){animation-delay:.4s}.page > *:nth-child(n+6){animation-delay:.5s}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}}
}

/* ---------- surfaces & controls ---------- */
.panel{position:relative;background:var(--panel-bg);border:var(--panel-border);border-radius:var(--radius);box-shadow:var(--panel-shadow);-webkit-backdrop-filter:var(--panel-blur);backdrop-filter:var(--panel-blur);padding:20px 22px;display:grid;gap:12px;align-content:start;min-width:0}
@media (max-width:520px){.panel{padding:18px}}
.btn{border:var(--btn-border);border-radius:var(--radius-btn);padding:12px 20px;font-weight:600;background:var(--btn-bg);color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .2s,box-shadow .2s,opacity .2s}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:7px 14px;font-size:.9rem}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:not(:disabled):active{transform:scale(.97)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.input,textarea{width:100%;min-width:0;border:var(--field-border);background:var(--field-bg);border-radius:var(--radius-sm);padding:13px 15px;font-size:1.05rem;color:var(--ink)}
textarea{resize:vertical;min-height:104px;line-height:1.45}
.input::placeholder,textarea::placeholder{color:var(--ink-3)}
.input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.entry{display:flex;gap:10px}
.entry .input{flex:1}
.lbl{font-weight:600;display:block}
.err{color:var(--danger);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:var(--chip-border);background:var(--chip-bg);border-radius:var(--radius-chip);padding:7px 13px;font-size:.92rem;text-align:left;color:var(--ink);max-width:100%;overflow-wrap:anywhere;transition:background .15s,color .15s,transform .12s}
.chip:not(:disabled):active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--c,var(--accent));color:var(--on-c,var(--on-accent));border-color:transparent}
.chip small{display:block;opacity:.75;font-size:.78rem;font-weight:400}
.stat{font-family:var(--mono);font-size:.76rem;border:var(--chip-border);background:var(--chip-bg);border-radius:999px;padding:4px 11px;white-space:nowrap;color:var(--ink)}
details{border-top:var(--hair);padding-top:10px}
summary{cursor:pointer;color:var(--ink-2);font-size:.92rem}
details[open] summary{margin-bottom:10px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);display:flex;gap:2px;padding:6px;background:var(--panel-bg);border:var(--panel-border);border-radius:var(--radius-tab);box-shadow:var(--panel-shadow);-webkit-backdrop-filter:var(--panel-blur);backdrop-filter:var(--panel-blur);z-index:10;transition:opacity .4s,transform .4s;max-width:calc(100% - 24px)}
.tabbar button{border:0;background:transparent;border-radius:calc(var(--radius-tab) - 4px);padding:7px 10px;display:grid;justify-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--ink-3);min-width:58px}
.tabbar button svg{width:20px;height:20px}
.tabbar button[aria-current="page"]{color:var(--ink);background:var(--tab-on)}
body.focus .tabbar,body.cine .tabbar{opacity:0;pointer-events:none;transform:translate(-50%,24px)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translate(-50%,-160%);background:var(--toast-bg);color:var(--toast-ink);padding:11px 18px;border-radius:var(--radius-btn);font-weight:600;z-index:60;transition:transform .35s cubic-bezier(.2,1.2,.4,1);max-width:calc(100% - 32px);text-align:center;box-shadow:var(--panel-shadow)}
.toast.show{transform:translate(-50%,0)}

/* ---------- world screen ---------- */
.w-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;max-width:1100px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.5rem;letter-spacing:var(--display-ls)}
.brand svg{width:30px;height:30px}
.w-bottom{display:grid;gap:12px;justify-items:center;width:100%}
.w-hint{font-family:var(--mono);font-size:.74rem;color:var(--ink-2);text-align:center;letter-spacing:.04em;text-shadow:var(--hint-shadow)}
.w-card{width:100%;max-width:560px}
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.prog span{display:grid;gap:5px;font-size:.7rem;color:var(--ink-3);font-family:var(--mono);letter-spacing:.03em}
.prog span::before{content:"";height:6px;border-radius:999px;background:var(--track)}
.prog span.on::before{background:var(--c,var(--accent))}
.prog span.on{color:var(--ink-2)}
.pop{width:100%;max-width:560px}
.intro-wrap{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:var(--scrim);z-index:30;pointer-events:auto}
.intro{max-width:480px;width:100%}
.how{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:h}
.how li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;color:var(--ink-2)}
.how li::before{counter-increment:h;content:counter(h);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;background:var(--accent);color:var(--on-accent)}
.how b{color:var(--ink)}

/* ---------- today ---------- */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.step{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--radius-sm);background:var(--sub-bg);border:var(--sub-border)}
.step .num:empty{border-style:dashed}
.step .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.85rem;border:var(--chip-border);color:var(--ink-2)}
.step.is-done .num{background:var(--c);color:var(--on-c);border-color:transparent}
.step.is-locked{opacity:.55}
.step h3{font-size:1.08rem;font-family:var(--body);font-weight:700;letter-spacing:0}
.step .help{font-size:.9rem}
@media (max-width:520px){.step{flex-wrap:wrap}.step .btn,.step .stat{margin-left:48px}}

/* ---------- drills ---------- */
.d-head{display:grid;gap:10px}
.clock{font-variant-numeric:tabular-nums}
.stage{display:grid;gap:18px}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink-3);display:block;transition:background .2s,transform .2s,border-color .2s}
.dots i.on{background:var(--c);border-color:var(--c);transform:scale(1.12)}
.dots span{font-family:var(--mono);font-size:.8rem;margin-left:6px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.field{position:relative;min-height:280px;border-radius:var(--radius);background:var(--field-bg);border:var(--field-border);padding:24px 16px;overflow:hidden}
.field svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cloud{position:relative;display:flex;flex-wrap:wrap;justify-content:space-around;align-items:center;gap:20px 16px;min-height:230px}
.field-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink-3);padding:24px;pointer-events:none}
.word{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--wc);color:var(--won);border-radius:var(--radius-chip);padding:.38em .5em .38em .9em;font-family:var(--display);line-height:1;box-shadow:var(--word-shadow)}
.word.anchor{background:transparent;color:var(--ink);border:1.5px dashed var(--ink-3);padding-right:.9em}
.word.near{outline:2px dashed var(--danger);outline-offset:4px}
.word button{width:1.45em;height:1.45em;border-radius:50%;border:1px solid currentColor;background:transparent;color:inherit;display:grid;place-items:center;font-size:.55em;padding:0;line-height:1;opacity:.75}
@media (prefers-reduced-motion:no-preference){.word.new{animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}@keyframes pop{from{transform:scale(.4);opacity:0}}}
.warns{display:grid;gap:8px}
.warn{display:flex;gap:10px;align-items:flex-start;border:1.5px dashed var(--danger);border-radius:var(--radius-sm);padding:10px 14px;background:var(--sub-bg);font-size:.95rem}
.small{font-size:.86rem;color:var(--ink-2)}
.lens{display:grid;gap:8px;border-radius:var(--radius);padding:16px 18px;background:var(--c);color:var(--on-c)}
.lens b{font-family:var(--display);font-size:1.3rem;line-height:1.15;font-weight:var(--display-w)}
.lens .btn{background:rgba(255,255,255,.85);color:#1a1a1a;border-color:transparent}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 7px var(--accent-soft)}}}
.uses{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.uses li{display:inline-flex;align-items:center;gap:8px;border:var(--chip-border);border-radius:var(--radius-sm);padding:8px 12px;background:var(--sub-bg);max-width:100%}
.uses .n{font-family:var(--mono);font-size:.72rem;color:var(--ink-3)}
.uses .t{overflow-wrap:anywhere}
.uses .tag{font-family:var(--mono);font-size:.68rem;background:var(--c);color:var(--on-c);border-radius:999px;padding:1px 8px}
.x{border:0;background:none;color:var(--ink-3);padding:0 2px;font-size:.95rem}
.object{display:grid;gap:6px}
.usually s{text-decoration-thickness:2px;text-decoration-color:var(--danger)}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.pair .side{border-radius:var(--radius);padding:22px 16px;text-align:center;font-family:var(--display);font-size:clamp(1.15rem,3.4vw,1.6rem);line-height:1.1;overflow-wrap:anywhere}
.pair .a{background:var(--c-bridge);color:var(--on-bridge)}
.pair .b{background:var(--c-second);color:var(--on-second)}
.pair .x-mark{font-family:var(--mono);font-size:.8rem;color:var(--ink-2)}
.angle{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:var(--sub-border);background:var(--sub-bg);border-radius:var(--radius-sm);padding:12px 16px}
.angle q{font-family:var(--display);font-size:1.12rem;quotes:none;flex:1 1 200px}
.links{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.links li{display:flex;gap:12px;align-items:flex-start;border-bottom:var(--hair);padding-block:8px}
.links li .t{flex:1;overflow-wrap:anywhere}
.result{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
@media (max-width:600px){.result{grid-template-columns:1fr}}
.stamp{width:150px;height:150px;border-radius:50%;background:var(--c);color:var(--on-c);display:grid;place-items:center;text-align:center;padding:14px;box-shadow:var(--stamp-shadow)}
.stamp b{display:block;font-family:var(--display);font-size:3.2rem;line-height:.9;font-weight:var(--display-w)}
.stamp span{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){.stamp{animation:stampIn .55s cubic-bezier(.2,1.5,.4,1) both}@keyframes stampIn{from{transform:scale(1.5) rotate(-20deg);opacity:0}}}

/* ---------- forge & shape ---------- */
.group-l{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.forge-bar{position:sticky;bottom:12px;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.forge-bar .count{flex:1 1 160px;font-size:.95rem;color:var(--ink-2)}
.ingredients{display:flex;flex-wrap:wrap;gap:6px}
.ing{font-size:.85rem;border:var(--chip-border);border-radius:var(--radius-chip);padding:4px 10px;background:var(--sub-bg);overflow-wrap:anywhere;max-width:100%}
.ing.hook{background:var(--c-notes);color:var(--on-notes);border-color:transparent}
.form{display:grid;gap:16px}
.form .f{display:grid;gap:6px}
.form .hint{font-size:.86rem;color:var(--ink-3)}

/* ---------- idea cards ---------- */
.idea-card{position:relative;border-radius:var(--radius);padding:0;display:grid;align-content:start;background:var(--ic-bg);color:var(--ic-ink);box-shadow:var(--ic-shadow);border:var(--ic-border);overflow:hidden;min-width:0}
.ic-body{padding:22px;display:grid;gap:10px;position:relative}
.ic-art{display:block;width:100%;height:auto;aspect-ratio:16/9}
.idea-card.mini .ic-body{padding:14px 16px;gap:6px}
.tilt{transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.idea-card .ic-top{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.idea-card h2,.idea-card h3{overflow-wrap:anywhere}
.idea-card p{overflow-wrap:anywhere}
.idea-card .ic-brief{font-size:.84rem;opacity:.75}
.idea-card .ingredients .ing{background:transparent;border-color:currentColor;color:inherit}
.idea-card.mini{cursor:pointer;text-align:left;font:inherit;color:var(--ic-ink)}
.idea-card.mini h3{font-size:1.2rem}
.idea-card .best{position:absolute;right:14px;top:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.week{display:grid;gap:12px}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:var(--scrim);overflow-y:auto}
.modal-card{width:100%;max-width:600px;display:grid;gap:14px;margin:auto}
.pop-card{gap:8px}
.pop-card .x{font-size:1rem}
/* reveal: the idea arrives slowly */
.reveal{max-width:640px;min-height:100%;align-content:center}
body[data-screen="reveal"] #veil{opacity:.55}
@media (prefers-reduced-motion:no-preference){
  .reveal > *{animation:none}
  .reveal .r-a{animation:fadeIn 1.2s ease both .2s}
  .reveal .idea-card{animation:cardIn 1.6s cubic-bezier(.2,.7,.2,1) both .4s}
  .reveal .ic-body > *{animation:fadeIn 1s ease both}
  .reveal .ic-body > *:nth-child(1){animation-delay:2.2s}.reveal .ic-body > *:nth-child(2){animation-delay:2.5s}.reveal .ic-body > *:nth-child(3){animation-delay:2.8s}.reveal .ic-body > *:nth-child(4){animation-delay:3.1s}.reveal .ic-body > *:nth-child(n+5){animation-delay:3.4s}
  .reveal .r-b{animation:fadeIn 1s ease both 4s}
  @keyframes fadeIn{from{opacity:0}}
  @keyframes cardIn{from{opacity:0;transform:perspective(1000px) translateY(30px) scale(.94) rotateX(8deg)}}
}
.copybox{width:100%;min-height:180px}

/* ---------- notes ---------- */
.why-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.why-grid{grid-template-columns:1fr}}
.nstep{display:grid;gap:8px}
.nstep .lbl{display:flex;gap:10px;align-items:baseline}
.nstep .lbl i{font-style:normal;font-family:var(--mono);font-size:.72rem;width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--c-notes);color:var(--on-notes)}
.chips.mech .chip{flex:1 1 190px}
.tally{display:grid;gap:6px}
.tally .bar{display:grid;grid-template-columns:120px 1fr 22px;gap:8px;align-items:center;font-size:.84rem}
.tally .track{height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.tally .fill{display:block;height:100%;background:var(--c-notes)}
.tally .v{font-family:var(--mono);text-align:right}
.tcard{display:grid;gap:6px;padding:14px 16px;border-radius:var(--radius-sm);background:var(--sub-bg);border:var(--sub-border)}
.tcard .head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:.7rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.tcard .what{font-weight:700;overflow-wrap:anywhere}
.tcard p{overflow-wrap:anywhere;font-size:.94rem}
.mtags{display:flex;flex-wrap:wrap;gap:6px}
.mtags span{background:var(--c-notes);color:var(--on-notes);border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600}

/* ---------- profile ---------- */
.rings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.rings{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ring{display:grid;justify-items:center;gap:6px;text-align:center}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring .lv{font-family:var(--display);font-size:1.5rem;line-height:1}
.ring .nm{font-weight:700}
.ring .sub{font-size:.78rem;color:var(--ink-3);font-family:var(--mono)}
.ring-wrap{position:relative;width:92px;height:92px}
.ring-wrap .lv{position:absolute;inset:0;display:grid;place-items:center}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.statgrid div{display:grid;gap:2px;padding:12px 14px;border-radius:var(--radius-sm);background:var(--sub-bg);border:var(--sub-border)}
.statgrid b{font-family:var(--display);font-size:1.7rem;line-height:1;font-weight:var(--display-w);font-variant-numeric:tabular-nums}
.statgrid span{font-size:.8rem;color:var(--ink-3)}
.unlocks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.unlocks li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--radius-sm);background:var(--sub-bg);border:var(--sub-border)}
.unlocks li.locked{opacity:.6}
.unlocks .ico{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--track);font-size:.9rem}
.unlocks li:not(.locked) .ico{background:var(--accent);color:var(--on-accent)}
.unlocks .grow p{font-size:.86rem;color:var(--ink-2)}
.linkish{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}

.star-label{position:absolute;left:0;top:0;transform:translate(-50%,-150%);white-space:nowrap;font-family:var(--display);font-size:.9rem;color:var(--ink);text-shadow:0 1px 8px rgba(0,0,0,.8);transition:opacity .3s;pointer-events:none}
/* ================= mobile-first layer =================
   Loaded after base.css. Touch rules apply everywhere; layout rules kick in on phone widths. */
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,.chip,.btn,summary,.idea-card.mini{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.input,textarea{font-size:max(16px,1.05rem)} /* 16px+ stops iOS zooming into fields */
@media (hover:none){
  .tilt{transform:none!important}
  .idea-card.mini:hover{transform:none}
}

@media (max-width:640px){
  #ui{padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 96px)}

  h3{font-size:1.15rem}

  .panel{padding:16px;border-radius:calc(var(--radius) - 2px)}

  /* touch targets */
  .btn{min-height:48px;padding:12px 18px}
  .btn.sm{min-height:40px;padding:8px 14px}
  .chip{padding:9px 14px;min-height:40px}
  .x{min-width:36px;min-height:36px}
  .word button{width:1.9em;height:1.9em}

  /* main actions go full width and stack */
  .panel .row > .btn.primary,.result .row > .btn,.reveal .row > .btn,.modal-card .row > .btn{flex:1 1 100%}
  .row > .btn.ghost{flex:1 1 auto}

  /* tab bar: full-width dock above the home indicator */
  .tabbar{left:10px;right:10px;transform:none;max-width:none;justify-content:space-around;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);padding:6px 4px}
  .tabbar button{flex:1;min-width:0;min-height:52px;padding:6px 2px;font-size:.68rem}
  .tabbar button svg{width:22px;height:22px}
  body.focus .tabbar,body.cine .tabbar{transform:translateY(24px)}

  /* galaxy home */
  .brand{font-size:1.3rem}
  .brand svg{width:26px;height:26px}
  .w-top .stat{font-size:.7rem;padding:3px 9px}
  .w-card h2{font-size:1.35rem}
  .w-card{gap:10px}
  .w-hint{font-size:.7rem}

  /* bottom sheets instead of centred dialogs */
  .intro-wrap,.modal{place-items:end center;padding:40px 0 0}
  .intro,.modal-card{max-width:none;border-radius:22px 22px 0 0}
  .intro{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
  .modal-card{max-height:calc(100dvh - 40px);overflow-y:auto;overscroll-behavior:contain;padding:14px 12px calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--bg);border-top:var(--panel-border)}
  @media (prefers-reduced-motion:no-preference){
    .intro,.modal-card{animation:sheetUp .6s cubic-bezier(.2,.8,.2,1) both}
    @keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
  }

  /* today */
  .step{display:grid;grid-template-columns:34px 1fr;gap:6px 12px;align-items:start;padding:14px}
  .step .btn,.step .stat{grid-column:2;justify-self:start;margin-left:0}
  .step .btn{min-width:120px}

  /* games */
  .d-head{gap:8px}
  .field{min-height:200px;padding:18px 10px}
  .cloud{min-height:170px;gap:14px 10px}
  .field .word{font-size:1rem!important}
  .stage .entry{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:4;padding:8px;margin:0 -8px;border-radius:calc(var(--radius-sm) + 6px);background:var(--bg);box-shadow:0 -12px 30px -12px rgba(0,0,0,.8)}
  .entry .btn{min-width:72px}
  .pair{grid-template-columns:1fr;gap:6px}
  .pair .side{padding:16px 12px}
  .pair .x-mark{justify-self:center}
  .angle q{font-size:1.05rem}
  .result{justify-items:center;text-align:center;gap:18px}
  .result .row{justify-content:center}
  .stamp{width:120px;height:120px}
  .stamp b{font-size:2.6rem}

  /* create */
  .forge-bar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);flex-direction:column;align-items:stretch;gap:8px;text-align:center}
  .forge-bar .btn{width:100%}
  .forge-bar .count{flex:none}

  /* idea cards */
  .ic-body{padding:16px}
  .idea-card h2{font-size:1.6rem}
  .cards{grid-template-columns:1fr}

  /* you */
  .statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .statgrid b{font-size:1.5rem}
  .ring svg,.ring-wrap{width:80px!important;height:80px!important}
  .unlocks li{display:grid;grid-template-columns:30px 1fr;gap:6px 12px}
  .unlocks li .stat{grid-column:2;justify-self:start;white-space:normal}
}

body:has(.intro-wrap) .tabbar{opacity:0;pointer-events:none}

<script>
window.SKIN = {
  name:'cosmos',
  fonts:['italic 400 36px "Newsreader"', '400 16px "Geist"'],
  ideaColors:['#F1D8A6', '#D3C4F1', '#B4C0F2', '#BBDCE0', '#F3C9B8', '#E6E1FF', '#C9E4CF'],
  worldWord:'galaxy', placeLabel:'Add to my galaxy', revealEyebrow:'Your new idea', artWord:'star picture',
  colorUnlock:['New star colours', 'Rose, pearl and jade stars'],
  worldLabel:'Your galaxy of ideas. Drag to look around. Tap a star to see its idea.',
  logo:'<svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="3.6" fill="#F1D8A6"/><ellipse cx="15" cy="15" rx="13" ry="5" fill="none" stroke="#B4C0F2" stroke-opacity=".7" stroke-width="1.2" transform="rotate(-24 15 15)"/><circle cx="26" cy="9" r="1.4" fill="#EDECF7"/></svg>',
  worldHint:'Drag to look around · tap a star to see its idea',
  worldEmpty:'Your galaxy is empty for now. Your first idea will be its first star.',
  introTitle:'Grow a galaxy of your own ideas.',
  introGrow:'Each idea becomes a star in your galaxy, with its own picture.',
  examples:['Waiting Room Radio', 'People waiting a long time to see a doctor', 'People vote on the next song while they wait. They can see the next song but not the rest, so they stay curious.'],
  doneTitle:i => `A new star is born: ${i.name.replace(/[<>&]/g, '')}.`
};

window.World = (() => {
  const T = window.THREE;
  const V = (x, y, z) => new T.Vector3(x, y, z);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DRILL = {far:'#F1D8A6', second:'#D3C4F1', bridge:'#B4C0F2', notes:'#BBDCE0'};
  let R, scene, camera, world, dust, dustGeo, halo, dot, labelsEl, onPick, canvasEl;
  const stars = new Map(); let lineGroup;
  const tweens = [];
  const cam = {p:V(0, 7, 14), l:V(0, 0, 0), tp:V(0, 7, 14), tl:V(0, 0, 0)};
  let view = 'world', yaw = 0, pitch = 0, tyaw = 0, tpitch = 0, zoom = 1, focusId = null, pending = null, shake = 0, px = 0, py = 0;
  const ray = new T.Raycaster(); const tmp = V(0, 0, 0);
  const MAXDUST = 14000;

  const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const out = k => 1 - Math.pow(1 - k, 3);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function tween(dur, fn){ return new Promise(res => tweens.push({t:0, dur:reduce ? dur * .5 : dur, fn, res})); }
  function slot(i){ const a = i * 2.39996 + .8, r = 1.6 + Math.sqrt(i) * .95; return V(Math.cos(a) * r, Math.sin(i * 1.7) * .35, Math.sin(a) * r); }
  const spread = () => 1.6 + Math.sqrt(Math.max(stars.size, 1)) * .95;

  function glow(){
    const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
    const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.18, 'rgba(255,255,255,.6)'); r.addColorStop(.45, 'rgba(255,255,255,.13)'); r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, 128, 128); return new T.CanvasTexture(c);
  }
  function dotTex(){
    const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d');
    const r = g.createRadialGradient(16, 16, 0, 16, 16, 16); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.35, 'rgba(255,255,255,.8)'); r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, 32, 32); return new T.CanvasTexture(c);
  }
  function textSprite(text, color){
    const c = document.createElement('canvas'); c.width = 1024; c.height = 128; const g = c.getContext('2d');
    g.font = 'italic 400 46px "Newsreader", Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    let s = text.length > 44 ? text.slice(0, 42) + '…' : text;
    g.shadowColor = 'rgba(0,0,0,.9)'; g.shadowBlur = 14; g.fillStyle = color || '#F4F5FF'; g.fillText(s, 512, 64);
    const tex = new T.CanvasTexture(c); const sp = new T.Sprite(new T.SpriteMaterial({map:tex, transparent:true, depthWrite:false, opacity:0}));
    sp.scale.set(2.6, .325, 1); return sp;
  }
  function makeStar(idea, best){
    const col = new T.Color(SKIN.ideaColors[idea.color || 0]);
    const core = new T.Mesh(new T.SphereGeometry(best ? .1 : .075, 16, 12), new T.MeshBasicMaterial({color:0xffffff}));
    const h = new T.Sprite(new T.SpriteMaterial({map:halo, color:col, transparent:true, blending:T.AdditiveBlending, depthWrite:false}));
    h.userData.id = idea.id; core.add(h);
    if (best) { const ring = new T.Mesh(new T.RingGeometry(.28, .3, 48), new T.MeshBasicMaterial({color:col, transparent:true, opacity:.7, side:T.DoubleSide, blending:T.AdditiveBlending})); ring.rotation.x = Math.PI / 2; core.add(ring); }
    const lab = document.createElement('div'); lab.className = 'star-label'; lab.textContent = idea.name; labelsEl.appendChild(lab);
    return {core, halo:h, lab, best, born:1, base:best ? 1.35 : 1, phase:Math.random() * 6, idea};
  }
  function clearStars(){ stars.forEach(s => { world.remove(s.core); s.lab.remove(); }); stars.clear(); }
  function rebuildLines(ideas){
    if (lineGroup) world.remove(lineGroup);
    lineGroup = new T.Group(); world.add(lineGroup);
    const byWeek = {};
    ideas.forEach(i => { const d = new Date(i.date); d.setDate(d.getDate() - (d.getDay() + 6) % 7); (byWeek[d.toDateString()] ||= []).push(i); });
    const mat = new T.LineBasicMaterial({color:0xC9CCEF, transparent:true, opacity:.28, blending:T.AdditiveBlending, depthWrite:false});
    Object.values(byWeek).forEach(list => { if (list.length < 2) return;
      const pts = list.map(i => stars.get(i.id)).filter(Boolean).map(s => s.core.position.clone());
      if (pts.length > 1) lineGroup.add(new T.Line(new T.BufferGeometry().setFromPoints(pts), mat)); });
  }
  let allIdeas = [], bests = [];

  function init(canvas, labels, cb){
    canvasEl = canvas; labelsEl = labels; onPick = cb.onPick;
    if (!T) return false;
    try { R = new T.WebGLRenderer({canvas, antialias:true, alpha:false}); } catch (e) { return false; }
    R.setPixelRatio(Math.min(devicePixelRatio, matchMedia('(pointer: coarse)').matches ? 1.6 : 2)); R.setClearColor(0x05060D, 1);
    scene = new T.Scene(); scene.fog = new T.FogExp2(0x05060D, .025);
    camera = new T.PerspectiveCamera(50, 1, .05, 400);
    world = new T.Group(); scene.add(world);
    halo = glow(); dot = dotTex();

    // galaxy dust: grows with sparks
    const pos = new Float32Array(MAXDUST * 3), col = new Float32Array(MAXDUST * 3);
    const cin = new T.Color(0xF3E3C3), cout = new T.Color(0x7C86D9), cc = new T.Color();
    for (let i = 0; i < MAXDUST; i++) {
      const r = Math.pow(Math.random(), 1.4) * 9, arm = (i % 3) * Math.PI * 2 / 3, a = arm + r * .62;
      const j = () => Math.pow(Math.random(), 3) * (Math.random() < .5 ? 1 : -1) * (.4 + r * .12);
      pos[i * 3] = Math.cos(a) * r + j(); pos[i * 3 + 1] = (Math.random() - .5) * .45 * (1 - r / 10); pos[i * 3 + 2] = Math.sin(a) * r + j();
      cc.copy(cin).lerp(cout, Math.min(1, r / 8)); if (Math.random() < .06) cc.set(0xC9B6F0);
      col[i * 3] = cc.r; col[i * 3 + 1] = cc.g; col[i * 3 + 2] = cc.b;
    }
    dustGeo = new T.BufferGeometry(); dustGeo.setAttribute('position', new T.BufferAttribute(pos, 3)); dustGeo.setAttribute('color', new T.BufferAttribute(col, 3));
    dust = new T.Points(dustGeo, new T.PointsMaterial({size:.06, map:dot, vertexColors:true, transparent:true, opacity:.95, depthWrite:false, blending:T.AdditiveBlending}));
    world.add(dust);
    // far background stars
    const bg = new Float32Array(2400 * 3);
    for (let i = 0; i < 2400; i++) { const v = V(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize().multiplyScalar(60 + Math.random() * 60); bg[i * 3] = v.x; bg[i * 3 + 1] = v.y; bg[i * 3 + 2] = v.z; }
    const bgGeo = new T.BufferGeometry(); bgGeo.setAttribute('position', new T.BufferAttribute(bg, 3));
    scene.add(new T.Points(bgGeo, new T.PointsMaterial({size:.35, map:dot, color:0xA9ABD0, transparent:true, opacity:.7, fog:false, depthWrite:false, blending:T.AdditiveBlending})));
    // nebula glows
    [[0x8F7FD0, -4, -3, 9], [0x4E5BB8, 5, 2, 12], [0xF1D8A6, 0, 0, 5]].forEach(([c, x, z, s]) => { const n = new T.Sprite(new T.SpriteMaterial({map:halo, color:c, transparent:true, opacity:.12, blending:T.AdditiveBlending, depthWrite:false})); n.position.set(x, -.3, z); n.scale.setScalar(s); world.add(n); });

    const size = () => { const w = innerWidth, h = innerHeight; R.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); };
    size(); addEventListener('resize', size);

    let down = null, pinch = null;
    const pts = new Map();
    const gap = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
    canvas.addEventListener('pointerdown', e => {
      pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      if (pts.size === 2 && view === 'world') { pinch = {d:gap(), zoom}; if (down) down.moved = true; focusId = null; return; }
      down = {x:e.clientX, y:e.clientY, yaw:tyaw, pitch:tpitch, moved:false};
    });
    canvas.addEventListener('pointermove', e => {
      if (pts.has(e.pointerId)) pts.set(e.pointerId, {x:e.clientX, y:e.clientY});

const EPOCH = new Date(2026, 0, 1);
const dayKey = (d = new Date()) => { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dayNum = (d = new Date()) => Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - EPOCH) / 864e5);
const mod = (a, n) => ((a % n) + n) % n;
const ORDER = (() => { const r = mulberry(20260926), a = BRIEFS.map((_, i) => i); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; })();
function today(){
  const dn = dayNum(), key = dayKey(), b = BRIEFS[ORDER[mod(dn, BRIEFS.length)]];
  return {dn, key, brief:b, obj:b.obj[mod(dn, 3)], pair:THINGS[mod(dn * 7, THINGS.length)], entry:S.days[key]};
}

function streak(){
  const days = new Set(Object.keys(S.days).filter(k => S.days[k].idea));
  let n = 0; const d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function bestStreak(){
  let best = 0, run = 0, prev = null;
  for (const k of Object.keys(S.days).filter(k => S.days[k].idea).sort()) { const d = new Date(k + 'T12:00'); run = prev && Math.round((d - prev) / 864e5) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  return best;
}

function award(g, delay = 500){
  const before = UNLOCKS.filter(u => has(u.id)).map(u => u.id), msgs = [];
  for (const [k, v] of Object.entries(g)) { if (!v) continue; const a = lvl(S.xp[k]).L; S.xp[k] += v; const b = lvl(S.xp[k]).L; if (b > a) msgs.push(`${SKILLS[k].name} is now level ${b}`); }
  UNLOCKS.filter(u => has(u.id) && !before.includes(u.id)).forEach(u => msgs.push(`New: ${u.name}`));
  save();
  msgs.forEach((m, i) => setTimeout(() => toast(m), delay + i * 3800));
  return g;
}

  try { navigator.clipboard.writeText(text).then(() => toast('Copied'), fallback); } catch (e) { fallback(); }
}
function openIdea(id){
  const i = S.ideas.find(x => x.id === id); if (!i) return;
  $$('.modal').forEach(m => m.remove());
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-label="${esc(i.name)}">${ideaCard(i)}<div class="row"><button class="btn primary" data-a="world">See it in my ${SKIN.worldWord}</button><button class="btn" data-a="copy">Copy text</button><button class="btn ghost" data-a="close">Close</button></div></div>`;
  document.body.append(m);
  const close = () => { m.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  m.addEventListener('click', e => {
    const a = e.target.closest('[data-a]');
    if (e.target === m || (a && a.dataset.a === 'close')) return close();
    if (!a) return;
    if (a.dataset.a === 'copy') copy(ideaText(i));
    if (a.dataset.a === 'world') { close(); go('world'); World.focus(i.id); showPop(i.id); }
  });
  $('[data-a="world"]', m).focus();
}

/* ================= DRILLS ================= */
function drillShell(type, mode, title, help, dirty){
  const D = DR[type], idx = {far:1, second:2, bridge:3}[type];
  ui.innerHTML = `<div class="page" style="--c:var(--c-${type});--on-c:var(--on-${type})">
    <div class="row"><button class="btn sm ghost" id="d-back">← Back</button><span class="grow"></span><span class="stat clock" id="clock">0:00</span></div>
    <header class="d-head"><p class="eyebrow">${mode === 'daily' ? `Game ${idx} of 3` : 'Extra game'} · ${D.name}</p>${title}<p class="help">${help}</p></header>
    <div id="stage" class="stage"></div></div>`;
  const back = () => {
    const n = dirty();
    if (!n) return go('today');
    $('#d-back').outerHTML = `<span class="small" id="d-leave">Leave now? You'll lose ${plural(n, 'answer')}. <button class="linkish" id="d-yes">Leave</button> · <button class="linkish" id="d-no">Stay</button></span>`;
    $('#d-yes').onclick = () => go('today');
    $('#d-no').onclick = () => { $('#d-leave').outerHTML = '<button class="btn sm ghost" id="d-back">← Back</button>'; $('#d-back').onclick = back; };
  };
  $('#d-back').onclick = back;
}
function dots(n, of){ let h = ''; for (let i = 0; i < of; i++) h += `<i class="${i < n ? 'on' : ''}"></i>`; return `<div class="dots" aria-label="${n} of ${of}">${h}<span>${n} / ${of}</span></div>`; }
function result(type, mode, n, label, line){
  const e = S.days[dayKey()] || {drills:{}}, next = ['far', 'second', 'bridge'].find(k => !e.drills[k]);
  const btns = mode === 'daily'
    ? (next ? `<button class="btn primary" id="r-next">Next game: ${DR[next].name} →</button><button class="btn" id="r-forge">Create an idea now</button>` : `<button class="btn primary" id="r-next">Create an idea →</button>`) + `<button class="btn ghost" id="r-today">Back</button>`
    : `<button class="btn primary" id="r-again">Play again</button><button class="btn ghost" id="r-today">Back</button>`;
  $('#stage').innerHTML = `<div class="panel"><div class="result"><div class="stamp"><div><b>${n}</b><span>${label}</span></div></div>
    <div style="display:grid;gap:12px"><h2>${line}</h2><p class="help">${plural(n, 'new spark')}, saved.</p><div class="row">${btns}</div></div></div></div>`;
  $('#stage').previousElementSibling.querySelector('.help').hidden = true;
  $('#d-back').onclick = () => go('today');
  const rf = $('#r-forge'); if (rf) rf.onclick = () => go('forge');
  const nx = $('#r-next'); if (nx) nx.onclick = () => next ? go('drill', {type:next, mode:'daily'}) : go('forge');
  const ag = $('#r-again'); if (ag) ag.onclick = () => go('drill', {type, mode:'free'});
  $('#r-today').onclick = () => go('today');
  stopClock();
}
function scrDrill(p){
  const e = S.days[dayKey()];
  if (p.mode === 'daily' && e && e.drills[p.type]) return go('today');
  ({far:drillFar, second:drillSecond, bridge:drillBridge})[p.type](p.mode);
}

/* ---- Far Apart ---- */
function norm(w){
  w = w.toLowerCase().trim().replace(/[^a-z\s-]/g, '').replace(/\s+/g, '');
  if (LEX[w]) return w;
  if (w.endsWith('ies') && w.length > 4) return w.slice(0, -3) + 'y';
  if (w.endsWith('es') && LEX[w.slice(0, -2)]) return w.slice(0, -2);
  if (w.endsWith('s') && !w.endsWith('ss') && w.length > 3) return w.slice(0, -1);
  return w;
}
function relate(a, b){
  const A = norm(a), B = norm(b);
  if (A.length >= 3 && B.length >= 3 && (A.includes(B) || B.includes(A))) return 'similar words';
  const ca = LEX[A] || [], cb = LEX[B] || [], c = ca.find(x => cb.includes(x));
  return c ? `both are ${c}` : null;
}
function drillFar(mode){
  const t = today(), anchor = mode === 'daily' ? t.brief.anchor : null;
  const st = {words:[], meta:{}, t0:Date.now()};
  drillShell('far', mode, '<h1>10 words. Nothing in common.</h1>',
    (anchor ? `Start with <b>“${esc(anchor)}”</b>. ` : '') + "Type words that have nothing to do with each other, like <i>volcano, violin, pizza</i>. If two words are too alike, a dashed line shows up so you can swap one.",
    () => st.words.length);
  $('#stage').innerHTML = `<div id="dots"></div>
    <div class="field" id="field"><svg class="lines" id="lines" aria-hidden="true"></svg><div class="cloud" id="cloud"></div><p class="field-empty" id="fe">${anchor ? '' : 'Your words appear here.'}</p></div>
    <div class="warns" id="warns" aria-live="polite"></div>
    <form class="entry" id="entry" autocomplete="off"><label for="far-in" class="sr">Next word</label><input class="input" id="far-in" maxlength="28" placeholder="Type a word and press Enter"><button class="btn primary" id="far-add">Add</button></form>
    <div class="row"><p class="small grow">We only catch obvious pairs, like sun and moon. You decide the rest.</p><button class="btn primary" id="far-done" disabled>Finish</button></div>`;
  startClock($('#clock'), st.t0);
  const input = $('#far-in'); softFocus(input);
  const all = () => anchor ? [anchor, ...st.words] : st.words;
  const pairs = () => { const a = all(), out = []; for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) { const r = relate(a[i], a[j]); if (r) out.push([i, j, r]); } return out; };
  function lines(){
    const f = $('#field'), svg = $('#lines'); if (!f) return;
    const fr = f.getBoundingClientRect(), els = $$('.word', f);
    svg.setAttribute('viewBox', `0 0 ${fr.width} ${fr.height}`);
    svg.innerHTML = pairs().map(([i, j]) => { const a = els[i].getBoundingClientRect(), b = els[j].getBoundingClientRect();
      return `<line x1="${a.left + a.width / 2 - fr.left}" y1="${a.top + a.height / 2 - fr.top}" x2="${b.left + b.width / 2 - fr.left}" y2="${b.top + b.height / 2 - fr.top}" stroke="var(--danger)" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>`; }).join('');
  }
  listen(window, 'resize', lines);
  function draw(newest){
    const P = pairs(), near = new Set(P.flatMap(p => [p[0], p[1]])), off = anchor ? 1 : 0;
    $('#fe').hidden = all().length > 0;
    $('#cloud').innerHTML = (anchor ? `<span class="word anchor" style="font-size:1.1rem">${esc(anchor)}</span>` : '') + st.words.map((w, i) => { const m = st.meta[w];
      return `<span class="word${near.has(i + off) ? ' near' : ''}${w === newest ? ' new' : ''}" style="--wc:var(--w${m.c});--won:var(--on-w${m.c});font-size:${m.size}rem;transform:rotate(${m.rot}deg) translateY(${m.dy}px)">${esc(w)}<button type="button" data-rm="${i}" aria-label="Remove ${esc(w)}">✕</button></span>`; }).join('');
    const a = all();
    $('#warns').innerHTML = P.map(([i, j, r]) => `<div class="warn"><span><b>${esc(a[i])}</b> and <b>${esc(a[j])}</b> are too alike (${r}). ${i === 0 && anchor ? `Try swapping <b>${esc(a[j])}</b>.` : 'Try swapping one.'}</span></div>`).join('');
    $('#dots').innerHTML = dots(st.words.length, 10);
    const full = st.words.length >= 10;
    input.disabled = full; $('#far-add').disabled = full;
    input.placeholder = full ? 'All 10 done. Swap a word, or tap Finish.' : 'Type a word and press Enter';
    $('#far-done').disabled = !full;
    requestAnimationFrame(lines); setTimeout(lines, 520);
  }
  draw();
  $('#entry').onsubmit = ev => {
    ev.preventDefault();
    const w = input.value.trim().replace(/\s+/g, ' '); if (!w) return;
    if (w.split(' ').length > 2) return toast('One word at a time. Two is OK, like "ice cream".');
    if (all().some(x => norm(x) === norm(w))) return toast(`"${w}" is already here.`);
    st.meta[w] = {c:st.words.length % 4 + 1, rot:(Math.random() * 8 - 4).toFixed(1), size:(1.05 + Math.random() * .55).toFixed(2), dy:Math.round(Math.random() * 20 - 10)};
    st.words.push(w); input.value = ''; World.spark('far'); draw(w); if (!input.disabled) input.focus();
  };
  $('#cloud').onclick = ev => { const b = ev.target.closest('[data-rm]'); if (!b) return; st.words.splice(+b.dataset.rm, 1); draw(); softFocus(input); };
  $('#far-done').onclick = () => {
    const near = pairs().length, words = st.words.slice();
    addSparks(words, 'far', mode === 'daily');
    if (mode === 'daily') { entry().drills.far = words.length; save(); }
    award({range:words.length + (near === 0 ? 5 : 0)});
    result('far', mode, words.length, 'sparks', near === 0 ? 'Great spread. No close pairs.' : near <= 2 ? 'Nice spread, with a couple of close ones.' : 'Some words were quite alike. Try jumping further next time.');
  };
}

/* ---- Second Life ---- */
function drillSecond(mode){
  const t = today();
  const pool = OBJECTS.concat(has('toolbox') ? TOOLBOX : []);
  const st = {obj:mode === 'daily' ? t.obj : pick(pool), uses:[], lens:null, deck:shuffle(LENSES.concat(has('wild') ? WILD : [])), lp:0, t0:Date.now(), last:Date.now(), used:new Set()};
  const head = () => `<div class="object"><h1 id="obj-name">${esc(st.obj[0])}</h1><p class="usually" id="usually">Usually used for <s>${esc(st.obj[1])}</s>. What else could it do?</p></div>`;
  drillShell('second', mode, head(), 'Think of new ways to use it. Silly ideas count. Add at least 5, and try for 10.', () => st.uses.length);
  $('#stage').innerHTML = `<div class="row"><div id="dots"></div><span class="grow"></span>${mode === 'free' ? '<button class="btn sm" id="reroll">Try another object</button>' : ''}</div>
    <div id="lens-slot"></div>
    <ol class="uses" id="uses"></ol>
    <form class="entry" id="entry" autocomplete="off"><label for="use-in" class="sr">A new use</label><input class="input" id="use-in" maxlength="120" placeholder="Use it as…"><button class="btn primary">Add</button></form>
    <div class="row end"><button class="btn primary" id="done" disabled>Finish</button></div>`;
  const input = $('#use-in'); softFocus(input);
  startClock($('#clock'), st.t0, () => { const b = $('#lens-btn'); if (b) b.classList.toggle('pulse', Date.now() - st.last > 20000); });
  function drawLens(){
    const slot = $('#lens-slot');
    if (!st.lens) { slot.innerHTML = `<button class="btn" id="lens-btn">Stuck? Get a hint</button>`; $('#lens-btn').onclick = nextLens; return; }
    slot.innerHTML = `<div class="lens" aria-live="polite"><span class="eyebrow" style="color:inherit;opacity:.8">Hint</span><b>${esc(st.lens[0])}</b><span>${esc(st.lens[1])}</span><div class="row"><button class="btn sm" id="lens-next">Another hint</button><button class="btn sm" id="lens-off">Hide hint</button></div></div>`;
    $('#lens-next').onclick = nextLens; $('#lens-off').onclick = () => { st.lens = null; drawLens(); softFocus(input); };
  }
  function nextLens(){ st.lens = st.deck[st.lp++ % st.deck.length]; st.last = Date.now(); drawLens(); softFocus(input); }
  function draw(){
    $('#dots').innerHTML = dots(Math.min(st.uses.length, 10), 10);
    $('#uses').innerHTML = st.uses.map((u, i) => `<li><span class="n">${i + 1}</span><span class="t">${esc(u.text)}</span>${u.lens ? '<span class="tag">hint</span>' : ''}<button class="x" data-rm="${i}" aria-label="Remove">✕</button></li>`).join('');
    $('#done').disabled = st.uses.length < 5;
    $('#done').textContent = st.uses.length < 5 ? `Finish (${5 - st.uses.length} more to go)` : 'Finish';
    const r = $('#reroll'); if (r) r.hidden = st.uses.length > 0;
  }
  draw(); drawLens();
  const r = $('#reroll');
  if (r) r.onclick = () => { let o; do { o = pick(pool); } while (o === st.obj); st.obj = o; $('#obj-name').textContent = o[0]; $('#usually').innerHTML = `Usually used for <s>${esc(o[1])}</s>. What else could it do?`; softFocus(input); };
  $('#entry').onsubmit = ev => {
    ev.preventDefault();
    const v = input.value.trim(); if (!v) return; const n = v.toLowerCase();
    if (st.uses.some(u => u.text.toLowerCase() === n)) return toast('You already added that.');
    if (st.obj[2].some(k => n.includes(k))) toast("That's close to what it's normally for. It counts, but try something new.");
    st.uses.push({text:v, lens:st.lens ? st.lens[0] : null}); if (st.lens) st.used.add(st.lens[0]);
    st.last = Date.now(); input.value = ''; World.spark('second'); draw(); input.focus();
  };
  $('#uses').onclick = ev => { const b = ev.target.closest('[data-rm]'); if (b) { st.uses.splice(+b.dataset.rm, 1); draw(); } };
  $('#done').onclick = () => {
    const name = st.obj[0].replace(/^(A|An|The) /, '').replace(/^pair of /, '');
    addSparks(st.uses.map(u => `${cap(name)} as ${u.text.replace(/^(use it |used )?as /i, '')}`), 'second', mode === 'daily');
    if (mode === 'daily') { entry().drills.second = st.uses.length; save(); }
    award({reframe:st.uses.length + st.used.size});
    result('second', mode, st.uses.length, 'new uses', st.uses.length >= 10 ? 'Ten or more. You went past the obvious.' : 'Nice. The unusual ideas often come after the first few.');
  };
}

/* ---- Bridge ---- */
function drillBridge(mode){
  const t = today();
  const pool = THINGS.concat(has('rare') ? RARE : []);
  const st = {links:[], t0:Date.now(), angles:shuffle(ANGLES), ap:-1};
  if (mode === 'daily') { st.a = t.brief.set; st.b = t.pair; } else { [st.a, st.b] = shuffle(pool); }
  drillShell('bridge', mode, '<h1>What do these two have in common?</h1>',
    'Look past the obvious. For example, an airport and a dating app both make you wait before the good part. Add at least 3, and try for 5.', () => st.links.length);
  const pairHTML = () => `<div class="pair"><div class="side a">${esc(cap(st.a))}</div><span class="x-mark">×</span><div class="side b">${esc(cap(st.b))}</div></div>`;
  $('#stage').innerHTML = `<div id="pair">${pairHTML()}</div>
    <div class="row"><div id="dots"></div><span class="grow"></span>${mode === 'free' ? '<button class="btn sm" id="reroll">Try another pair</button>' : ''}</div>
    <div class="angle"><q id="angle-q">Stuck? Get a question to think about.</q><button class="btn sm" id="angle-btn">Get a hint</button></div>
    <ul class="links" id="links"></ul>
    <form class="entry" id="entry" autocomplete="off"><label for="link-in" class="sr">A shared trait</label><input class="input" id="link-in" maxlength="200" placeholder="Both…"><button class="btn primary">Add</button></form>
    <div class="row end"><button class="btn primary" id="done" disabled>Finish</button></div>`;
  startClock($('#clock'), st.t0);
  const input = $('#link-in'); softFocus(input);
  function draw(){
    $('#dots').innerHTML = dots(Math.min(st.links.length, 5), 5);
    $('#links').innerHTML = st.links.map((l, i) => `<li><span class="t">${esc(l)}</span><button class="x" data-rm="${i}" aria-label="Remove">✕</button></li>`).join('');
    $('#done').disabled = st.links.length < 3;
    $('#done').textContent = st.links.length < 3 ? `Finish (${3 - st.links.length} more to go)` : 'Finish';
    const r = $('#reroll'); if (r) r.hidden = st.links.length > 0;
  }
  draw();
  const r = $('#reroll'); if (r) r.onclick = () => { [st.a, st.b] = shuffle(pool); $('#pair').innerHTML = pairHTML(); softFocus(input); };
  $('#angle-btn').onclick = () => { st.ap = (st.ap + 1) % st.angles.length; $('#angle-q').textContent = st.angles[st.ap]; $('#angle-btn').textContent = 'Another hint'; softFocus(input); };
  $('#entry').onsubmit = ev => { ev.preventDefault(); const v = input.value.trim(); if (!v) return; st.links.push(v); input.value = ''; World.spark('bridge'); draw(); input.focus(); };
  $('#links').onclick = ev => { const b = ev.target.closest('[data-rm]'); if (b) { st.links.splice(+b.dataset.rm, 1); draw(); } };
  $('#done').onclick = () => {
    addSparks(st.links.map(l => `${cap(st.a)} × ${st.b}: ${l}`), 'bridge', mode === 'daily');
    if (mode === 'daily') { entry().drills.bridge = st.links.length; save(); }
    award({connect:st.links.length * 2});
    result('bridge', mode, st.links.length, 'links', st.links.length >= 5 ? 'Five or more links. Great eye.' : 'Nice. You found what they share.');
  };
}

/* ================= FORGE ================= */
let forge = {sparks:new Set(), hook:null, draft:{name:'', who:'', how:''}};
function hookOf(h){
  if (!h) return null;
  if (h.type === 'note') { const n = S.notes.find(x => x.id === h.id); if (!n) return null; return {label:n.mechs[0] || n.own || 'Something I noticed', detail:n.what, note:true}; }
  const m = MECHS.concat(MECHS_ADV).find(x => x[0] === h.name); return m ? {label:m[0], detail:m[1], note:false} : null;
}
function scrForge(){
  if (S.sparks.length < 2) { toast('You need 2 sparks first. Play a game to get some.'); return go('today'); }
  const t = today();
  const todays = S.sparks.filter(s => s.day === t.key);
  const older = S.sparks.filter(s => s.day !== t.key).slice(-40).reverse();
  const chip = s => `<button type="button" class="chip" data-sp="${s.id}" aria-pressed="${forge.sparks.has(s.id)}">${esc(s.text)}</button>`;
  const group = k => { const l = todays.filter(s => s.drill === k); return l.length ? `<p class="group-l">${DR[k].name}</p><div class="chips">${l.map(chip).join('')}</div>` : ''; };
  const notes = S.notes.slice().reverse().slice(0, 10);
  const hk = (attr, on, label, title) => `<button type="button" class="chip" ${attr} aria-pressed="${on}" title="${esc(title)}">${esc(label)}</button>`;
  const mechChips = MECHS.concat(has('advhooks') ? MECHS_ADV : []).map(([m, d]) => hk(`data-mech="${esc(m)}"`, !!(forge.hook && forge.hook.type === 'mech' && forge.hook.name === m), m, d)).join('');
  const d = forge.draft;
  ui.innerHTML = `<div class="page">
    <div class="row"><button class="btn sm ghost" data-back>← Back</button></div>
    <header class="d-head"><p class="eyebrow">Create · ${esc(t.brief.t)}</p><h1>Turn your sparks into an idea.</h1><p class="help">Choose 2 or 3 sparks, pick what will make people notice, then describe your idea.</p></header>
    <section class="panel"><div class="row"><h3 class="grow">1. Choose 2 or 3 sparks</h3><span class="stat" id="f-n">0 picked</span></div>
      ${todays.length ? group('far') + group('second') + group('bridge') : ''}
      ${older.length ? (todays.length ? `<details><summary>Older sparks (${older.length})</summary><div class="chips">${older.map(chip).join('')}</div></details>` : `<p class="group-l">Your sparks</p><div class="chips">${older.map(chip).join('')}</div>`) : ''}</section>
    <section class="panel"><div class="row"><h3 class="grow">2. What will make people notice it?</h3><button type="button" class="btn sm ghost" id="f-note">+ Add something you noticed</button></div>
      <p class="small" id="f-hook-d">Pick one reason people will care.</p>
      ${notes.length ? `<p class="group-l">From things you noticed</p><div class="chips">${notes.map(n => hk(`data-note="${n.id}"`, !!(forge.hook && forge.hook.type === 'note' && forge.hook.id === n.id), n.mechs[0] || n.own || 'Something I noticed', n.what)).join('')}</div><details><summary>More reasons</summary><div class="chips">${mechChips}</div></details>`
      : `<div class="chips">${mechChips}</div>`}</section>
    <section class="panel form"><h3>3. Describe your idea</h3>
      <div class="f"><label class="lbl" for="s-name">Give it a name</label><input class="input" id="s-name" maxlength="60" placeholder="e.g. ${esc(SKIN.examples[0])}" value="${esc(d.name)}"></div>
      <div class="f"><label class="lbl" for="s-how">How does it work?</label><textarea id="s-how" rows="3" maxlength="600" placeholder="e.g. ${esc(SKIN.examples[2])}">${esc(d.how)}</textarea></div>
      <div class="f"><label class="lbl" for="s-who">Who is it for? <span class="small">(optional)</span></label><input class="input" id="s-who" maxlength="120" placeholder="e.g. ${esc(SKIN.examples[1])}" value="${esc(d.who)}"></div>
    </section>
    <div class="panel forge-bar"><span class="count" id="f-count"></span><button class="btn primary" id="f-go" disabled>Create it</button></div>
  </div>`;
  $('[data-back]').onclick = () => go('today');
  forge.sparks = new Set([...forge.sparks].filter(id => S.sparks.some(s => s.id === id)));
  const upd = () => {
    const n = forge.sparks.size, h = hookOf(forge.hook);
    const name = $('#s-name').value.trim(), how = $('#s-how').value.trim();
    forge.draft = {name:$('#s-name').value, how:$('#s-how').value, who:$('#s-who').value};
    $('#f-n').textContent = `${n} picked`;
    if (h) $('#f-hook-d').textContent = `${h.label}: ${h.detail}`;
    const need = n < 2 ? `Choose ${2 - n} more spark${2 - n === 1 ? '' : 's'}` : !h ? 'Pick a reason people will notice' : !name ? 'Give it a name' : how.length < 12 ? 'Say how it works' : 'Ready!';
    $('#f-count').textContent = need;
    $('#f-go').disabled = need !== 'Ready!';
  };
  upd();
  ['#s-name', '#s-how', '#s-who'].forEach(s => $(s).addEventListener('input', upd));
  ui.onclick = ev => {
    const sp = ev.target.closest('[data-sp]');
    if (sp) { const id = sp.dataset.sp; if (forge.sparks.has(id)) forge.sparks.delete(id); else { if (forge.sparks.size >= 3) return toast('You can pick up to 3. Remove one first.'); forge.sparks.add(id); }
      $$(`[data-sp="${id}"]`).forEach(b => b.setAttribute('aria-pressed', forge.sparks.has(id))); upd(); return; }
    const c = ev.target.closest('[data-note],[data-mech]');
    if (c) { forge.hook = c.dataset.note ? {type:'note', id:c.dataset.note} : {type:'mech', name:c.dataset.mech};
      $$('[data-note],[data-mech]').forEach(b => b.setAttribute('aria-pressed', b === c)); upd(); }
  };
  cleanups.push(() => { ui.onclick = null; });
  $('#f-note').onclick = () => go('notes', {back:'forge'});
  $('#f-go').onclick = async () => {
    const sp = [...forge.sparks].map(id => S.sparks.find(s => s.id === id)).filter(Boolean), h = hookOf(forge.hook);
    if (sp.length < 2 || !h) return;
    $('#f-go').disabled = true;
    const colors = has('colors') ? SKIN.ideaColors.length : 4, e = entry();
    const idea = {id:uid(), n:S.ideas.length + 1, name:$('#s-name').value.trim(), who:$('#s-who').value.trim(), how:$('#s-how').value.trim(),
      sparks:sp.map(s => s.text), hook:h, brief:t.brief.t, shape:t.brief.shape, date:new Date().toISOString(), color:S.ideas.length % colors};
    S.ideas.push(idea); if (!e.idea) e.idea = idea.id; save();
    const g = {range:0, reframe:0, connect:0, insight:h.note ? 4 : 0};
    sp.forEach(s => { g[DR[s.drill].skill] += 3; });
    award(g, 12000);
    forge = {sparks:new Set(), hook:null, draft:{name:'', who:'', how:''}};
    await cinematic(World.forge(idea.sparks, h.label));
    go('reveal', {id:idea.id});
  };
}

/* ================= REVEAL ================= */
function scrReveal(p){
  const i = S.ideas.find(x => x.id === p.id); if (!i) return go('world');
  ui.innerHTML = `<div class="page reveal">
    <p class="eyebrow r-a">${SKIN.revealEyebrow}</p>
    ${ideaCard(i, false, true)}
    <div class="row r-b"><button class="btn primary grow" id="r-place">${SKIN.placeLabel}</button><button class="btn ghost" id="r-copy">Copy text</button></div>
  </div>`;
  $('#r-copy').onclick = () => copy(ideaText(i));
  $('#r-place').onclick = async () => {
    $('#r-place').disabled = true;
    await cinematic(World.place(i));
    go('world'); World.focus(i.id); showPop(i.id);
    setTimeout(() => toast(`“${i.name}” is now in your ${SKIN.worldWord}`), 600);
  };
}

/* ================= skill rings ================= */
function ring(k, size = 92){
  const {L, into, need} = lvl(S.xp[k]), r = 38, c = 2 * Math.PI * r, f = into / need;
  return `<div class="ring"><div class="ring-wrap"><svg viewBox="0 0 92 92" style="width:${size}px;height:${size}px" aria-hidden="true"><circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--track)" stroke-width="7"/><circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--ring, var(--c-${SKILLS[k].c}))" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - f)}"/></svg><span class="lv">${L}</span></div><span class="nm">${SKILLS[k].name}</span><span class="sub">${into}/${need} to level ${L + 1}</span></div>`;
}

/* ================= NOTES ================= */
function scrNotes(p){
  const F = {action:null, mechs:[]};
  const mechs = MECHS.concat(has('advhooks') ? MECHS_ADV : []);
  ui.innerHTML = `<div class="page" style="max-width:1040px">
    ${p.back === 'forge' ? '<div class="row"><button class="btn sm ghost" data-back>← Back to your idea</button></div>' : ''}
    <header class="d-head" style="max-width:720px"><p class="eyebrow">Noticed</p><h1>What caught your eye?</h1><p class="help">Did something make you stop, click, laugh or buy? Write down what it was and why it worked. You can use it later when you create an idea.</p></header>
    <div class="why-grid">
      <form class="panel form" id="why" novalidate autocomplete="off">
        <div class="f"><label class="lbl" for="n-what">What caught your eye?</label><input class="input" id="n-what" maxlength="160" placeholder="e.g. A video that showed the ending first"></div>
        <div class="f"><span class="lbl" id="mech-l">Why did it work on you?</span>
          <div class="chips" role="group" aria-labelledby="mech-l" id="mechs">${mechs.map(([m, d]) => `<button type="button" class="chip" aria-pressed="false" data-m="${esc(m)}" title="${esc(d)}">${esc(m)}</button>`).join('')}</div>
          <p class="small" id="mech-d">Pick up to 2, or write your own.</p>
          <label class="sr" for="n-own">In my own words</label><input class="input" id="n-own" maxlength="200" placeholder="Or say it in your own words…"></div>
        <details id="more"><summary>Add more (optional)</summary>
          <div class="form" style="margin-top:6px">
            <div class="f"><span class="lbl" id="act-l">What did you do?</span><div class="chips" role="group" aria-labelledby="act-l" id="acts">${ACTIONS.map(a => `<button type="button" class="chip" aria-pressed="false" data-a="${esc(a)}">${esc(a)}</button>`).join('')}</div></div>
            <div class="f"><label class="lbl" for="n-detail">What exactly caught you?</label><input class="input" id="n-detail" maxlength="200" placeholder="e.g. The finished dish came first"></div>
            <div class="f"><label class="lbl" for="n-transfer">Where else could this work?</label><input class="input" id="n-transfer" maxlength="240" placeholder="e.g. A sign-up page that shows the result first"></div>
          </div></details>
        <p class="err" id="n-err" hidden></p>
        <div class="row"><button class="btn primary grow">Save</button></div>
      </form>
      <aside id="file" style="display:grid;gap:14px"></aside>
    </div></div>`;
  const b = $('[data-back]'); if (b) b.onclick = () => go('forge');
  $('#acts').onclick = ev => { const c = ev.target.closest('[data-a]'); if (!c) return; const on = F.action !== c.dataset.a; $$('#acts .chip').forEach(x => x.setAttribute('aria-pressed', on && x === c)); F.action = on ? c.dataset.a : null; };
  $('#mechs').onclick = ev => { const c = ev.target.closest('[data-m]'); if (!c) return; const m = c.dataset.m;
    if (F.mechs.includes(m)) F.mechs = F.mechs.filter(x => x !== m); else { if (F.mechs.length >= 2) return toast('You can pick up to 2. Remove one first.'); F.mechs.push(m); }
    c.setAttribute('aria-pressed', F.mechs.includes(m));
    $('#mech-d').textContent = F.mechs.length ? F.mechs.map(x => `${x}: ${mechs.find(y => y[0] === x)[1].toLowerCase()}`).join(' · ') : 'Pick up to 2, or write your own.'; };
  $('#why').onsubmit = ev => {
    ev.preventDefault();
    const v = id => $(id).value.trim(), what = v('#n-what'), own = v('#n-own'), err = $('#n-err');
    const miss = !what ? 'Write what caught your eye.' : (!F.mechs.length && !own) ? 'Pick a reason, or write your own.' : '';
    if (miss) { err.textContent = miss; err.hidden = false; return; }
    const note = {id:uid(), date:new Date().toISOString(), what, action:F.action || '', detail:v('#n-detail'), mechs:F.mechs.slice(), own, transfer:v('#n-transfer')};
    S.notes.push(note); save(); award({insight:3}); World.spark('notes');
    if (p.back === 'forge') { forge.hook = {type:'note', id:note.id}; toast('Saved. We picked it for your idea.'); go('forge'); }
    else { toast('Saved'); go('notes'); }
  };
  const N = S.notes.slice().reverse(), counts = {};
  N.forEach(n => n.mechs.forEach(m => counts[m] = (counts[m] || 0) + 1));
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5), max = top.length ? top[0][1] : 1;
  const card = (n, ex) => `<article class="tcard"><div class="head"><span>${ex ? 'Example' : shortDate(n.date)}</span><span>${esc(n.action)}</span></div><p class="what">${esc(n.what)}</p>${n.detail ? `<p><b>What exactly:</b> ${esc(n.detail)}</p>` : ''}${n.mechs.length ? `<div class="mtags">${n.mechs.map(m => `<span>${esc(m)}</span>`).join('')}</div>` : ''}${n.own ? `<p>${esc(n.own)}</p>` : ''}${n.transfer ? `<p class="small"><b>Could work in:</b> ${esc(n.transfer)}</p>` : ''}</article>`;
  const ex = {what:'A recipe video that opened on the finished dish, then cut to "3 ingredients"', action:'Kept watching', detail:'The result first, and the tiny number in big type', mechs:['Looked easy', 'Made me curious'], own:'', transfer:'An onboarding screen that shows the finished profile before asking for details'};
  $('#file').innerHTML = `<div class="panel"><p class="eyebrow">Your collection</p><h3>${N.length ? plural(N.length, 'thing') + ' noticed' : 'Nothing yet'}</h3>
    ${top.length ? `<p class="small">What catches you most</p><div class="tally">${top.map(([m, c]) => `<div class="bar"><span>${esc(m)}</span><span class="track"><span class="fill" style="width:${c / max * 100}%"></span></span><span class="v">${c}</span></div>`).join('')}</div>` : '<p class="help">Add one whenever something grabs you, even outside the app.</p>'}</div>
    ${N.length ? N.slice(0, 8).map(n => card(n)).join('') : card(ex, true)}`;
  softFocus($('#n-what'));
}

/* ================= GALLERY ================= */
function scrGallery(){
  const ideas = S.ideas.slice().reverse(), weeks = {};
  ideas.forEach(i => (weeks[weekKey(i.date)] ||= []).push(i));
  const cw = weekKey(new Date()), sunday = new Date().getDay() === 0;
  ui.innerHTML = `<div class="page" style="max-width:1040px">
    <header class="d-head"><p class="eyebrow">${plural(ideas.length, 'idea')} · ${plural(S.sparks.length, 'spark')}</p><h1>Your ideas</h1><p class="help">Every idea you've created. Star your favourite each week.</p></header>
    ${sunday && weeks[cw] && !S.weekBest[cw] ? `<div class="panel"><h3>It's Sunday. Pick your favourite idea this week.</h3></div>` : ''}
    ${ideas.length ? Object.entries(weeks).map(([wk, list]) => `<section class="week"><div class="row"><h3 class="grow">Week of ${shortDate(wk + 'T12:00')}</h3>${S.weekBest[wk] ? `<span class="stat">★ ${esc((S.ideas.find(x => x.id === S.weekBest[wk]) || {}).name || '')}</span>` : ''}</div>
      <div class="cards">${list.map(i => `<div style="display:grid;gap:8px">${ideaCard(i, true)}<button class="btn sm ${S.weekBest[wk] === i.id ? 'primary' : 'ghost'}" data-best="${i.id}" data-wk="${wk}">${S.weekBest[wk] === i.id ? '★ Favourite' : '☆ Make favourite'}</button></div>`).join('')}</div></section>`).join('')
    : `<div class="panel" style="justify-items:start"><h3>No ideas yet</h3><p class="help">Play a game or two, then create your first idea. It will show up here with its own ${SKIN.artWord}.</p><button class="btn primary" id="g-go">Start today's challenge</button></div>`}
  </div>`;
  const gg = $('#g-go'); if (gg) gg.onclick = () => go('today');
  ui.onclick = ev => {
    const c = ev.target.closest('[data-idea]'); if (c) return openIdea(c.dataset.idea);
    const b = ev.target.closest('[data-best]'); if (b) { const wk = b.dataset.wk;
      if (S.weekBest[wk] === b.dataset.best) delete S.weekBest[wk]; else { S.weekBest[wk] = b.dataset.best; toast("Marked as this week's favourite"); }
      save(); World.setIdeas(S.ideas, bestIds()); scrGallery(); }
  };
  cleanups.push(() => { ui.onclick = null; });
}

/* ================= PROFILE ================= */
function scrProfile(){
  const answered = Object.values(S.days).filter(d => d.idea).length;
  const us = UNLOCKS.map(u => { const on = has(u.id), l = lvl(S.xp[u.skill]);
    return `<li class="${on ? '' : 'locked'}"><span class="ico">${on ? '✓' : '·'}</span><div class="grow"><b>${esc(u.name)}</b><p>${esc(u.desc)}</p></div><span class="stat">${on ? 'Unlocked' : `Needs ${SKILLS[u.skill].name} level ${u.lvl}${l.L === u.lvl - 1 ? ` · ${l.need - l.into} points to go` : ''}`}</span></li>`; }).join('');
  ui.innerHTML = `<div class="page">
    <header class="d-head"><p class="eyebrow">You</p><h1>Your progress</h1></header>
    <div class="statgrid"><div><b>${S.ideas.length}</b><span>ideas</span></div><div><b>${S.sparks.length}</b><span>sparks</span></div><div><b>${S.notes.length}</b><span>things noticed</span></div><div><b>${answered}</b><span>challenges done</span></div></div>
    <div class="panel"><h3>Skills</h3><p class="help">Each game grows one skill. Fill a ring to unlock new things.</p><div class="rings">${Object.keys(SKILLS).map(k => ring(k)).join('')}</div>
      <p class="small">Range: Random Words · Reuse: New Uses · Linking: Find the Link · Noticing: Noticed</p></div>
    <div class="panel"><h3>Unlocks</h3><ul class="unlocks">${us}</ul></div>
    <p class="small" id="wipe">Your progress is saved in this browser only. <button class="linkish" id="wipe-btn">Delete everything</button></p>
  </div>`;
  $('#wipe-btn').onclick = () => {
    $('#wipe').innerHTML = `Delete all your ideas, sparks and progress? You can't undo this. <button class="linkish" id="w-yes">Yes, delete</button> · <button class="linkish" id="w-no">Cancel</button>`;
    $('#w-yes').onclick = () => { S = blank(); save(); World.setIdeas([], []); World.setSparks(0); toast('Everything deleted'); go('world'); };
    $('#w-no').onclick = scrProfile;
  };
}

const SCREENS = {world:scrWorld, today:scrToday, drill:scrDrill, forge:scrForge, reveal:scrReveal, notes:scrNotes, gallery:scrGallery, profile:scrProfile, done:p => { go('world'); if (p.id) openIdea(p.id); }};

/* ================= boot ================= */
const fontsReady = document.fonts && document.fonts.load ? Promise.all(SKIN.fonts.map(f => document.fonts.load(f))).catch(() => {}) : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(() => {
  const ok = World.init(canvas, labels, {onPick:id => { if (current === 'world') { showPop(id); World.focus(id); } else openIdea(id); }});
  if (ok === false) canvas.insertAdjacentHTML('afterend', '');
  World.setIdeas(S.ideas, bestIds());
  World.setSparks(S.sparks.length);
  go('world');
});
};
if (document.body) sidestepApp(); else document.addEventListener('DOMContentLoaded', sidestepApp);
</script>
